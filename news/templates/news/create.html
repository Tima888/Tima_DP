{% extends 'main/layout.html' %}

{% block title %} Додавання новини {% endblock %}


{% block content %}
{% if user.is_authenticated %}
    <div class="features">
        <h1 class="form-title">Додавання новини</h1>
       <form method="post">
           {% csrf_token %}
           {{ form.title }}<br>
           {{ form.anons }}<br>
           {{ form.full_text }}<br>
            {{ form.date }}<br>
            <span>{{ error }}</span>
            <button class="btn btn-success" type="submit">Зберегти новину</button>
    </form>
    </div>
{% endif %}
{% endblock %}
